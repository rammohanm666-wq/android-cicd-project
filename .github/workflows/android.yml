
name: Android CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]

permissions:
  contents: read

jobs:
  build:
    name: Build and test Android app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission
        working-directory: android-app
        run: chmod +x gradlew

      - name: Clean project
        working-directory: android-app
        run: ./gradlew clean

      - name: Run lint
        working-directory: android-app
        run: ./gradlew lint

      - name: Build and test
        working-directory: android-app
        run: ./gradlew build

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn
