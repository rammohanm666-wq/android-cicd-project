
name: Android CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find Gradle wrapper
        id: find-gradle
        shell: bash
        run: |
          GRADLEW=$(find . -maxdepth 6 -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: gradlew not found."
            echo "Ensure your Android Gradle project is committed to GitHub."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Gradle wrapper: $GRADLEW"

      - name: Grant execute permission
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: chmod +x gradlew

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Clean project
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: ./gradlew clean

      - name: Run lint
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: ./gradlew lint

      - name: Build and test
        working-directory: ${{ steps.find-gradle.outputs.project_dir }}
        run: ./gradlew build

      - name: Upload APK files
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: '**/build/outputs/apk/**/*.apk'
          if-no-files-found: warn
