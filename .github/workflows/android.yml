
name: Android CI

on:
  push:
    branches: [main, develop, qa]
  pull_request:
    branches: [main, develop, qa]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Check Android Project Files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Display repository files
        run: |
          echo "Repository root:"
          pwd
          ls -la

          echo "Searching for Gradle files:"
          find . -maxdepth 8 -type f \( \
            -name "gradlew" -o \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" -o \
            -name "build.gradle" -o \
            -name "build.gradle.kts" \
          \) -print

      - name: Verify Gradle wrapper
        run: |
          GRADLEW=$(find . -maxdepth 8 -type f -name gradlew | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "ERROR: No gradlew file exists in the repository."
            echo "Add a valid Android Gradle project and commit its Gradle wrapper."
            exit 1
          fi

          chmod +x "$GRADLEW"
          echo "Gradle wrapper found: $GRADLEW"
